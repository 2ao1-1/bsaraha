# Netlify Configuration File

# Build Settings
[build]
  command = "npm run build"
  publish = "dist"

# Redirects for SPA (Single Page Application)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# API Proxy (اختياري - إذا كنت تستخدم proxy)
# استبدل YOUR_BACKEND_URL بالـ URL الحقيقي للـ Backend
# [[redirects]]
#   from = "/api/*"
#   to = "https://YOUR_BACKEND_URL.com/api/:splat"
#   status = 200
#   force = true

# Headers for Security
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Cache Static Assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"